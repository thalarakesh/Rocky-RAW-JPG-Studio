
name: Build Rocky RAW JPG Studio Desktop EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install rawpy --only-binary=:all:

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Rocky_RAW_JPG_Studio --add-data "index.html;." --add-data "assets;assets" --collect-all webview --collect-all rawpy app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Rocky-RAW-JPG-Studio-Windows
          path: dist/Rocky_RAW_JPG_Studio.exe
          if-no-files-found: error
